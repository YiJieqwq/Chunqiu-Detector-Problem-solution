name: Astro prototype checks
on:
  push:
    branches: [astro-prototype]
    paths: ['experiments/astro/**', 'language/**', 'File/**', '.github/workflows/astro-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/astro/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: astro-prototype-site
          path: experiments/astro/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astro-prototype-browser-screenshots
          path: experiments/astro/test-results
